name: Update IPTV EPG

on:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Asia/Manila'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout EPG storage branch
        uses: actions/checkout@v4
        with:
          ref: epg-data
          path: epg-storage

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Download latest SITES.md
        run: |
          curl -fsSL https://raw.githubusercontent.com/iptv-org/epg/master/SITES.md -o /tmp/SITES.md

      - name: Select next EPG batch
        id: batch
        shell: python
        run: |
          import os, re, json, hashlib

          # TEMPORARY: exclude DSTV while its parser/API issue is investigated.
          # Remove dstv.com from this set after the source is fixed.
          SKIP_SITES = {"dstv.com"}
          with open("/tmp/SITES.md", encoding="utf-8") as f:
              content = f.read()

          sites = []
          for row in re.findall(r'<tr\b[^>]*>(.*?)</tr>', content, re.S | re.I):
              if "🟢" not in row:
                  continue
              match = re.search(r'href="sites/([^"]+)"', row)
              if match and match.group(1) not in SKIP_SITES:
                  sites.append(match.group(1))
          sites = list(dict.fromkeys(sites))
          if not sites:
              raise SystemExit("No active EPG sources found.")

          print("Temporarily excluded:", ", ".join(sorted(SKIP_SITES)))
          os.makedirs("epg-storage/work/guides", exist_ok=True)
          os.makedirs("diagnostics", exist_ok=True)
          state_file = "epg-storage/work/progress.json"
          signature = hashlib.sha256(",".join(sites).encode()).hexdigest()
          state = {"signature": signature, "index": 0, "complete": False}

          if os.path.exists(state_file):
              try:
                  with open(state_file, encoding="utf-8") as f:
                      old = json.load(f)
                  if old.get("signature") == signature:
                      state = old
                  else:
                      print("Eligible source list changed; resetting the index but retaining previously downloaded guide files.")
              except (OSError, json.JSONDecodeError) as exc:
                  print(f"Could not read progress ({exc}); starting from index 0.")

          state["signature"] = signature
          state["index"] = max(0, int(state.get("index", 0)))
          if state["index"] >= len(sites):
              state["complete"] = True
          with open(state_file, "w", encoding="utf-8") as f:
              json.dump(state, f, indent=2)

          if state.get("complete"):
              print("All eligible EPG sources completed.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=true\n")
              raise SystemExit(0)

          batch_size = 5
          index = state["index"]
          batch = sites[index:index + batch_size]
          if not batch:
              raise SystemExit("No sources selected.")
          next_index = index + len(batch)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=false\n")
              f.write(f"sites={','.join(batch)}\n")
              f.write(f"signature={signature}\n")
              f.write(f"next={next_index}\n")
              f.write(f"complete={str(next_index >= len(sites)).lower()}\n")
          print(f"Eligible sources: {len(sites)}; batch: {batch}; index: {index}")

      - name: Download EPG batch
        id: download
        if: steps.batch.outputs.skip != 'true'
        shell: bash
        env:
          SITES: ${{ steps.batch.outputs.sites }}
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          git -C epg-storage config user.name "github-actions[bot]"
          git -C epg-storage config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          is_valid_xml() {
            python - "$1" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
              if root.tag != "tv" or len(root) == 0:
                  raise ValueError("empty XML or root is not <tv>")
          except Exception as exc:
              print(f"XML validation failed: {exc}", file=sys.stderr)
              sys.exit(1)
          PY
          }

          save_source() {
            local site="$1"
            git -C epg-storage add -- "work/guides/${site}.xml"
            if git -C epg-storage diff --cached --quiet; then
              echo "No content change to commit for ${site}"
              return 0
            fi
            git -C epg-storage commit -m "Save completed EPG source: ${site}" || return 1
            git -C epg-storage push origin HEAD:epg-data
          }

          IFS=',' read -ra SITE_LIST <<< "$SITES"
          # Never consume the entire Actions job on one slow source.
          # Leave ten minutes for diagnostics, merge, and Pages deployment.
          GLOBAL_DEADLINE=$((SECONDS + 45 * 60))
          ATTEMPT_TIMEOUT=240
          MAX_ATTEMPTS=2
          RETRY_DELAY=15
          FAILED=0
          COMPLETED=0

          for site in "${SITE_LIST[@]}"; do
            FILE="epg-storage/work/guides/${site}.xml"
            LOG="diagnostics/${site}.log"
            {
              echo "========================================"
              echo "Source: ${site}"
              echo "Started UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            } | tee -a "$LOG"

            if [ -s "$FILE" ] && is_valid_xml "$FILE"; then
              echo "Already completed; skipping." | tee -a "$LOG"
              COMPLETED=$((COMPLETED + 1))
              continue
            fi

            rm -f "$FILE"
            SOURCE_OK=0
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              REMAINING=$((GLOBAL_DEADLINE - SECONDS))
              if [ "$REMAINING" -lt $((ATTEMPT_TIMEOUT + 600)) ]; then
                echo "Insufficient safe runtime for another attempt; defer to next hourly run." | tee -a "$LOG"
                break
              fi

              echo "Attempt ${attempt}/${MAX_ATTEMPTS}; timeout ${ATTEMPT_TIMEOUT}s" | tee -a "$LOG"
              timeout --signal=TERM --kill-after=20s "${ATTEMPT_TIMEOUT}s" \
                npm run grab -- \
                  --sites="$site" \
                  --output="epg-storage/work/guides/{site}.xml" \
                2>&1 | tee -a "$LOG"
              GRABBER_RC=${PIPESTATUS[0]}

              if [ "$GRABBER_RC" -eq 0 ] && [ -s "$FILE" ] && is_valid_xml "$FILE"; then
                echo "Grabber finished; XML is valid." | tee -a "$LOG"
                if save_source "$site" 2>&1 | tee -a "$LOG"; then
                  echo "SUCCESS: ${site} saved to epg-data." | tee -a "$LOG"
                  SOURCE_OK=1
                  COMPLETED=$((COMPLETED + 1))
                  break
                else
                  echo "ERROR: Git commit/push failed for ${site}." | tee -a "$LOG"
                fi
              else
                if [ "$GRABBER_RC" -eq 124 ] || [ "$GRABBER_RC" -eq 137 ] || [ "$GRABBER_RC" -eq 143 ]; then
                  echo "TIMEOUT: ${site}; exit code ${GRABBER_RC}." | tee -a "$LOG"
                else
                  echo "FAILED: ${site}; exit code ${GRABBER_RC} or XML missing/invalid." | tee -a "$LOG"
                fi
                rm -f "$FILE"
              fi

              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "Retrying this source in ${RETRY_DELAY}s." | tee -a "$LOG"
                sleep "$RETRY_DELAY"
              fi
            done

            if [ "$SOURCE_OK" -ne 1 ]; then
              echo "SOURCE FAILED: ${site}. Moving to the next source; retry next hourly run." | tee -a "$LOG"
              FAILED=$((FAILED + 1))
              rm -f "$FILE"
            fi
            echo "Finished UTC: $(date -u '+%Y-%m-%d %H:%M:%S')" | tee -a "$LOG"
          done

          ALL_COMPLETE=1
          for site in "${SITE_LIST[@]}"; do
            FILE="epg-storage/work/guides/${site}.xml"
            if [ ! -s "$FILE" ] || ! is_valid_xml "$FILE"; then
              ALL_COMPLETE=0
              break
            fi
          done

          {
            echo "## EPG batch result"
            echo ""
            echo "- Sources in batch: ${#SITE_LIST[@]}"
            echo "- Completed or already valid: ${COMPLETED}"
            echo "- Failed/deferred: ${FAILED}"
            echo "- DSTV is temporarily excluded in source selection."
            echo "- Failed sources remain in this batch and retry on the next hourly run."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ALL_COMPLETE" -eq 1 ]; then
            echo "All sources in this batch are complete."
            echo "batch_complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "Batch incomplete; completed files are saved, failed files will retry next run."
            echo "batch_complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload EPG diagnostics
        if: always() && steps.batch.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: epg-diagnostics-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Combine all EPG files
        if: |
          steps.batch.outputs.skip != 'true' &&
          steps.download.outputs.batch_complete == 'true'
        shell: python
        run: |
          import os, glob
          import xml.etree.ElementTree as ET
          os.makedirs("public", exist_ok=True)
          # Keep the old DSTV file in storage, but do not publish it while DSTV is excluded.
          files = sorted(
              filename for filename in glob.glob("epg-storage/work/guides/*.xml")
              if os.path.basename(filename) != "dstv.com.xml"
          )
          if not files:
              raise SystemExit("No EPG files available.")
          root = ET.Element("tv")
          total_elements = 0
          for filename in files:
              print(f"Combining: {filename}")
              try:
                  source = ET.parse(filename).getroot()
                  if source.tag != "tv":
                      raise ValueError(f"Unexpected XML root in {filename}")
                  if not root.attrib:
                      root.attrib.update(source.attrib)
                  elements = list(source)
                  root.extend(elements)
                  total_elements += len(elements)
              except Exception as exc:
                  raise SystemExit(f"Failed to process {filename}: {exc}")
          if total_elements == 0:
              raise SystemExit("Combined guide contains no XML elements.")
          output = "public/guide.xml"
          ET.ElementTree(root).write(output, encoding="utf-8", xml_declaration=True)
          if os.path.getsize(output) == 0:
              raise SystemExit("Combined guide.xml is empty.")
          print(f"Total source files: {len(files)}")
          print(f"Total XML elements: {total_elements}")
          print(f"Guide size: {os.path.getsize(output)} bytes")

      - name: Configure GitHub Pages
        if: |
          steps.batch.outputs.skip != 'true' &&
          steps.download.outputs.batch_complete == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: |
          steps.batch.outputs.skip != 'true' &&
          steps.download.outputs.batch_complete == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        if: |
          steps.batch.outputs.skip != 'true' &&
          steps.download.outputs.batch_complete == 'true'
        uses: actions/deploy-pages@v4

      - name: Update EPG progress
        id: progress
        if: steps.deploy.outcome == 'success'
        shell: python
        env:
          SIGNATURE: ${{ steps.batch.outputs.signature }}
          NEXT_INDEX: ${{ steps.batch.outputs.next }}
          COMPLETE: ${{ steps.batch.outputs.complete }}
        run: |
          import os, json
          state = {
              "signature": os.environ["SIGNATURE"],
              "index": int(os.environ["NEXT_INDEX"]),
              "complete": os.environ["COMPLETE"] == "true"
          }
          with open("epg-storage/work/progress.json", "w", encoding="utf-8") as f:
              json.dump(state, f, indent=2)
          print("Progress updated after successful Pages deployment.")
          print(f"Next index: {state['index']}")
          print(f"All eligible sources completed: {state['complete']}")

      - name: Save EPG progress
        if: steps.progress.outcome == 'success'
        shell: bash
        run: |
          set -e
          cd epg-storage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/progress.json
          if git diff --cached --quiet; then
            echo "No progress changes to save."
          else
            git commit -m "Update EPG download progress"
            git push origin HEAD:epg-data
          fi
