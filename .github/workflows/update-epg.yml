
name: Update IPTV EPG

on:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Asia/Manila'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Checkout EPG storage branch
      - name: Checkout EPG storage branch
        uses: actions/checkout@v4
        with:
          ref: epg-data
          path: epg-storage

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install

      # 5. Download latest SITES.md
      - name: Download latest SITES.md
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/iptv-org/epg/master/SITES.md \
            -o /tmp/SITES.md

      # 6. Select current batch
      - name: Select next EPG batch
        id: batch
        shell: python
        run: |
          import os
          import re
          import json
          import hashlib
          import shutil

          with open("/tmp/SITES.md", encoding="utf-8") as f:
              content = f.read()

          sites = []

          for row in re.findall(
              r'<tr\b[^>]*>(.*?)</tr>',
              content,
              re.S | re.I
          ):
              if "🟢" not in row:
                  continue

              match = re.search(r'href="sites/([^"]+)"', row)

              if match:
                  sites.append(match.group(1))

          sites = list(dict.fromkeys(sites))

          if not sites:
              raise SystemExit("No active EPG sources found.")

          os.makedirs("epg-storage/work/guides", exist_ok=True)

          state_file = "epg-storage/work/progress.json"

          signature = hashlib.sha256(
              ",".join(sites).encode()
          ).hexdigest()

          state = {
              "signature": signature,
              "index": 0,
              "complete": False
          }

          if os.path.exists(state_file):
              with open(state_file, encoding="utf-8") as f:
                  old = json.load(f)

              if old.get("signature") == signature:
                  state = old
              else:
                  print("Source list changed. Resetting progress.")

                  shutil.rmtree(
                      "epg-storage/work/guides",
                      ignore_errors=True
                  )

                  os.makedirs(
                      "epg-storage/work/guides",
                      exist_ok=True
                  )

          state["signature"] = signature
          state["index"] = int(state.get("index", 0))

          if state["index"] >= len(sites):
              state["complete"] = True

          with open(state_file, "w", encoding="utf-8") as f:
              json.dump(state, f, indent=2)

          if state.get("complete"):
              print("All EPG sources completed.")

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=true\n")

              raise SystemExit(0)

          batch_size = 5
          index = state["index"]

          batch = sites[index:index + batch_size]

          if not batch:
              raise SystemExit("No sources selected.")

          next_index = index + len(batch)
          complete = next_index >= len(sites)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=false\n")
              f.write(f"sites={','.join(batch)}\n")
              f.write(f"signature={signature}\n")
              f.write(f"next={next_index}\n")
              f.write(f"complete={str(complete).lower()}\n")

          print(f"Total active sources: {len(sites)}")
          print(f"Current batch: {batch}")
          print(f"Current index: {index}")

      # 7. Download sources one by one
      - name: Download EPG batch
        id: download
        if: steps.batch.outputs.skip != 'true'
        shell: bash
        env:
          SITES: ${{ steps.batch.outputs.sites }}
        run: |
          set -uo pipefail

          git -C epg-storage config user.name "github-actions[bot]"
          git -C epg-storage config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          is_valid_xml() {
            python - "$1" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse(sys.argv[1]).getroot()

              if root.tag != "tv":
                  sys.exit(1)

              if len(root) == 0:
                  sys.exit(1)

          except Exception:
              sys.exit(1)

          sys.exit(0)
          PY
          }

          save_source() {
            local site="$1"

            git -C epg-storage add -- \
              "work/guides/${site}.xml" \
              work/progress.json

            if ! git -C epg-storage diff --cached --quiet; then
              git -C epg-storage commit \
                -m "Save completed EPG source: ${site}"

              git -C epg-storage push origin HEAD:epg-data
            fi
          }

          IFS=',' read -ra SITE_LIST <<< "$SITES"

          # Reserve 7 minutes for finalization and saving.
          DEADLINE=$((SECONDS + 48 * 60))

          STOPPED=0

          for site in "${SITE_LIST[@]}"; do

            FILE="epg-storage/work/guides/${site}.xml"

            echo "================================"
            echo "Source: $site"

            # Skip already completed sources.
            if [ -s "$FILE" ] && is_valid_xml "$FILE"; then
              echo "Already completed: $site"
              continue
            fi

            # Check remaining execution time.
            REMAINING=$((DEADLINE - SECONDS))

            if [ "$REMAINING" -lt 120 ]; then
              echo "Time limit approaching."
              echo "Will continue with $site next hour."
              STOPPED=1
              break
            fi

            # Remove only the incomplete current source.
            rm -f "$FILE"

            echo "Downloading: $site"

            if timeout --signal=TERM "${REMAINING}s" \
              npm run grab -- \
                --sites="$site" \
                --output="epg-storage/work/guides/{site}.xml"; then

              if [ -s "$FILE" ] && is_valid_xml "$FILE"; then

                echo "SUCCESS: $site"

                # Save immediately to epg-data.
                save_source "$site"

              else
                echo "Incomplete or invalid XML: $site"
                rm -f "$FILE"
                STOPPED=1
                break
              fi

            else
              echo "Download stopped or failed: $site"
              rm -f "$FILE"
              STOPPED=1
              break
            fi

          done

          # Check whether every source in the current batch is ready.
          ALL_COMPLETE=1

          for site in "${SITE_LIST[@]}"; do
            FILE="epg-storage/work/guides/${site}.xml"

            if [ ! -s "$FILE" ] || ! is_valid_xml "$FILE"; then
              ALL_COMPLETE=0
              break
            fi
          done

          if [ "$ALL_COMPLETE" -eq 1 ]; then
            echo "All five sources are complete."
            echo "batch_complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "Some sources remain unfinished."
            echo "They will continue next hour."
            echo "batch_complete=false" >> "$GITHUB_OUTPUT"
          fi

      # 8. Combine all completed EPG files
      - name: Combine all EPG files
        if: |
          steps.batch.outputs.skip != 'true' &&
          steps.download.outputs.batch_complete == 'true'
        shell: python
        run: |
          import os
          import glob
          import xml.etree.ElementTree as ET

          os.makedirs("public", exist_ok=True)

          files = sorted(
              glob.glob("epg-storage/work/guides/*.xml")
          )

          if not files:
              raise SystemExit("No EPG files available.")

          root = ET.Element("tv")

          for filename in files:
              print(f"Combining: {filename}")

              try:
                  tree = ET.parse(filename)
                  source = tree.getroot()

                  if source.tag != "tv":
                      raise ValueError(
                          f"Unexpected XML root: {filename}"
                      )

                  if not root.attrib:
                      root.attrib.update(source.attrib)

                  root.extend(list(source))

              except Exception as e:
                  raise SystemExit(
                      f"Failed to process {filename}: {e}"
                  )

          output = "public/guide.xml"

          ET.ElementTree(root).write(
              output,
              encoding="utf-8",
              xml_declaration=True
          )

          if os.path.getsize(output) == 0:
              raise SystemExit("Combined guide.xml is empty.")

          print(f"Total files: {len(files)}")
          print(f"Guide size: {os.path.getsize(output)} bytes")

      # 9. Configure GitHub Pages
      - name: Configure GitHub Pages
        if: |
          steps.batch.outputs.skip != 'true' &&
          steps.download.outputs.batch_complete == 'true'
        uses: actions/configure-pages@v5

      # 10. Upload Pages artifact
      - name: Upload Pages artifact
        if: |
          steps.batch.outputs.skip != 'true' &&
          steps.download.outputs.batch_complete == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 11. Deploy updated guide
      - name: Deploy to GitHub Pages
        id: deploy
        if: |
          steps.batch.outputs.skip != 'true' &&
          steps.download.outputs.batch_complete == 'true'
        uses: actions/deploy-pages@v4

      # 12. Update progress after successful deployment
      - name: Update EPG progress
        id: progress
        if: steps.deploy.outcome == 'success'
        shell: python
        env:
          SIGNATURE: ${{ steps.batch.outputs.signature }}
          NEXT_INDEX: ${{ steps.batch.outputs.next }}
          COMPLETE: ${{ steps.batch.outputs.complete }}
        run: |
          import os
          import json

          state = {
              "signature": os.environ["SIGNATURE"],
              "index": int(os.environ["NEXT_INDEX"]),
              "complete": os.environ["COMPLETE"] == "true"
          }

          with open(
              "epg-storage/work/progress.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(state, f, indent=2)

          print("EPG progress successfully updated.")
          print(f"Next index: {state['index']}")
          print(f"All sources completed: {state['complete']}")

      # 13. Save progress to storage branch
      - name: Save EPG progress
        if: steps.progress.outcome == 'success'
        shell: bash
        run: |
          set -e

          cd epg-storage

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add work/

          if git diff --cached --quiet; then
            echo "No storage changes to save."
          else
            git commit -m "Update EPG download progress"
            git push origin HEAD:epg-data
          fi
