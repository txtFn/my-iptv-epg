name: Update IPTV EPG

on:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Asia/Manila'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      BATCH_SIZE: 5
      SITE_TIMEOUT: 420
      MAX_ATTEMPTS: 5
      RETRY_COOLDOWN: 3600

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Checkout EPG storage branch
      - name: Checkout EPG storage branch
        uses: actions/checkout@v4
        with:
          ref: epg-data
          path: epg-storage

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install

      # 5. Download latest SITES.md
      - name: Download latest SITES.md
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/iptv-org/epg/master/SITES.md \
            -o /tmp/SITES.md

      # 6. Select the current batch
      - name: Select next EPG batch
        id: batch
        shell: python
        run: |
          import os
          import re
          import json
          import hashlib
          import shutil

          with open('/tmp/SITES.md', encoding='utf-8') as f:
              content = f.read()

          sites = []
          for row in re.findall(r'<tr\b[^>]*>(.*?)</tr>', content, re.S | re.I):
              if '🟢' not in row:
                  continue
              match = re.search(r'href="sites/([^"]+)"', row)
              if match:
                  sites.append(match.group(1))

          sites = list(dict.fromkeys(sites))
          if not sites:
              raise SystemExit('No active EPG sources found.')

          os.makedirs('epg-storage/work/guides', exist_ok=True)
          state_file = 'epg-storage/work/progress.json'
          failures_file = 'epg-storage/work/failures.json'
          signature = hashlib.sha256(','.join(sites).encode()).hexdigest()

          state = {'signature': signature, 'index': 0, 'complete': False}
          if os.path.exists(state_file):
              with open(state_file, encoding='utf-8') as f:
                  old = json.load(f)
              if old.get('signature') == signature:
                  state = old
              else:
                  print('Source list changed. Resetting progress and retry state.')
                  shutil.rmtree('epg-storage/work/guides', ignore_errors=True)
                  os.makedirs('epg-storage/work/guides', exist_ok=True)
                  with open(failures_file, 'w', encoding='utf-8') as f:
                      json.dump({}, f, indent=2)

          state['signature'] = signature
          state['index'] = int(state.get('index', 0))

          if state['index'] >= len(sites):
              state['complete'] = True

          with open(state_file, 'w', encoding='utf-8') as f:
              json.dump(state, f, indent=2)

          if state.get('complete'):
              print('All EPG sources have been processed.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=true\n')
              raise SystemExit(0)

          batch_size = int(os.environ.get('BATCH_SIZE', '5'))
          index = state['index']
          batch = sites[index:index + batch_size]
          if not batch:
              raise SystemExit('No sources selected.')

          next_index = index + len(batch)
          complete = next_index >= len(sites)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('skip=false\n')
              f.write(f"sites={','.join(batch)}\n")
              f.write(f'signature={signature}\n')
              f.write(f'next={next_index}\n')
              f.write(f'complete={str(complete).lower()}\n')

          print(f'Total active sources: {len(sites)}')
          print(f'Current batch: {batch}')
          print(f'Current index: {index}')

      # 7. Download EPG sources one by one, with retry tracking
      - name: Download EPG batch
        id: download
        if: steps.batch.outputs.skip != 'true'
        timeout-minutes: 45
        shell: bash
        env:
          SITES: ${{ steps.batch.outputs.sites }}
        run: |
          set -uo pipefail

          git -C epg-storage config user.name "github-actions[bot]"
          git -C epg-storage config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p epg-storage/work/guides epg-storage/work/logs
          [ -f epg-storage/work/failures.json ] || echo '{}' > epg-storage/work/failures.json
          if [ ! -f epg-storage/work/failed-sources.csv ]; then
            echo 'site,attempts,last_attempt_utc,status,last_error' > epg-storage/work/failed-sources.csv
          fi

          is_valid_xml() {
            python - "$1" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
              if root.tag != 'tv' or len(root) == 0:
                  sys.exit(1)
          except Exception:
              sys.exit(1)
          sys.exit(0)
          PY
          }

          site_status() {
            python - "$1" "$RETRY_COOLDOWN" <<'PY'
          import sys, json, time
          site = sys.argv[1]
          cooldown = int(sys.argv[2])
          try:
              with open('epg-storage/work/failures.json', encoding='utf-8') as f:
                  data = json.load(f)
          except Exception:
              data = {}
          item = data.get(site, {})
          if item.get('status') == 'permanent':
              print('permanent')
          elif int(item.get('next_retry', 0)) > int(time.time()):
              print('cooldown')
          else:
              print('ready')
          PY
          }

          record_failure() {
            local site="$1"
            local reason="$2"
            python - "$site" "$reason" "$MAX_ATTEMPTS" "$RETRY_COOLDOWN" <<'PY'
          import sys, json, time, csv, os
          site, reason = sys.argv[1], sys.argv[2]
          max_attempts, cooldown = int(sys.argv[3]), int(sys.argv[4])
          path = 'epg-storage/work/failures.json'
          try:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
          except Exception:
              data = {}
          now = int(time.time())
          item = data.get(site, {})
          attempts = int(item.get('attempts', 0)) + 1
          status = 'permanent' if attempts >= max_attempts else 'retry'
          item.update({
              'attempts': attempts,
              'last_attempt': now,
              'next_retry': 0 if status == 'permanent' else now + cooldown,
              'status': status,
              'last_error': reason
          })
          data[site] = item
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
          csv_path = 'epg-storage/work/failed-sources.csv'
          new_file = not os.path.exists(csv_path)
          with open(csv_path, 'a', newline='', encoding='utf-8') as f:
              writer = csv.writer(f)
              if new_file:
                  writer.writerow(['site', 'attempts', 'last_attempt_utc', 'status', 'last_error'])
              writer.writerow([site, attempts, time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime(now)), status, reason])
          print(f'{site}: attempt {attempts}/{max_attempts}; status={status}')
          PY
          }

          clear_failure() {
            local site="$1"
            python - "$site" <<'PY'
          import sys, json
          site = sys.argv[1]
          path = 'epg-storage/work/failures.json'
          try:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
          except Exception:
              data = {}
          if site in data:
              del data[site]
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
          PY
          }

          save_source() {
            local site="$1"
            clear_failure "$site"
          }

          IFS=',' read -ra SITE_LIST <<< "$SITES"
          # Keep the download step well inside the 55-minute job limit.
          # This leaves time for checkout/install, final Git push, and deployment.
          DEADLINE=$((SECONDS + 40 * 60))

          for site in "${SITE_LIST[@]}"; do
            FILE="epg-storage/work/guides/${site}.xml"
            echo '================================'
            echo "Source: $site"
            LOG="epg-storage/work/logs/${site//\//_}.log"
            {
              echo "===== $(date -u +%Y-%m-%dT%H:%M:%SZ) | $site ====="
              echo "Starting source processing"
            } | tee -a "$LOG"

            if [ -s "$FILE" ] && is_valid_xml "$FILE"; then
              echo "Already completed: $site"
              save_source "$site"
              continue
            fi

            STATUS="$(site_status "$site")"
            if [ "$STATUS" = 'permanent' ]; then
              echo "Permanently failed; skipping: $site"
              continue
            elif [ "$STATUS" = 'cooldown' ]; then
              echo "Retry cooldown active; skipping until next eligible run: $site"
              continue
            fi

            REMAINING=$((DEADLINE - SECONDS))
            if [ "$REMAINING" -lt 120 ]; then
              echo "Time limit approaching. Remaining sources will continue next hour."
              break
            fi

            AVAILABLE=$((REMAINING - 120))
            SOURCE_TIMEOUT=$((AVAILABLE < SITE_TIMEOUT ? AVAILABLE : SITE_TIMEOUT))
            rm -f "$FILE"

            echo "Downloading: $site (timeout: $((SOURCE_TIMEOUT / 60)) minutes)"
            echo "Command started at $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$LOG"

            # tee preserves a live Actions log and a per-site diagnostic log.
            # PIPESTATUS[0] captures timeout's status, not tee's status.
            timeout --verbose --signal=TERM --kill-after=30s "${SOURCE_TIMEOUT}s" \
              stdbuf -oL -eL npm run grab -- \
                --sites="$site" \
                --output="epg-storage/work/guides/{site}.xml" 2>&1 | tee -a "$LOG"
            RESULT=${PIPESTATUS[0]}
            echo "Command finished at $(date -u +%Y-%m-%dT%H:%M:%SZ) with exit code $RESULT" | tee -a "$LOG"

            if [ "$RESULT" -eq 0 ]; then
              if [ -s "$FILE" ] && is_valid_xml "$FILE"; then
                echo "SUCCESS: $site"
                save_source "$site"
              else
                echo "FAILED: invalid or incomplete XML: $site"
                rm -f "$FILE"
                record_failure "$site" "Invalid or incomplete XML"
              fi
            else
              rm -f "$FILE"
              if [ "$RESULT" -eq 124 ] || [ "$RESULT" -eq 137 ]; then
                REASON="Download timed out after $((SOURCE_TIMEOUT / 60)) minutes"
              else
                REASON="EPG grab exited with code $RESULT"
              fi
              echo "FAILED: $site - $REASON"
              echo "$REASON" | tee -a "$LOG"
              record_failure "$site" "$REASON"
            fi
          done

          # Save all XML and retry-state changes in one Git commit/push.
          # Avoids multiple slow pushes during a single batch.
          git -C epg-storage add -- work/
          if ! git -C epg-storage diff --cached --quiet; then
            git -C epg-storage commit -m "Save EPG batch results and retry state"
            git -C epg-storage push origin HEAD:epg-data
          else
            echo 'No EPG storage changes to commit.'
          fi

          # A batch is resolved when each source has valid XML or has reached
          # the permanent-failure limit. Temporary failures remain for retry.
          ALL_RESOLVED=1
          for site in "${SITE_LIST[@]}"; do
            FILE="epg-storage/work/guides/${site}.xml"
            if [ -s "$FILE" ] && is_valid_xml "$FILE"; then
              continue
            fi
            STATUS="$(site_status "$site")"
            if [ "$STATUS" != 'permanent' ]; then
              ALL_RESOLVED=0
              break
            fi
          done

          if [ "$ALL_RESOLVED" -eq 1 ]; then
            echo 'All sources in this batch are completed or permanently failed.'
            echo 'batch_complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Some sources are waiting for another retry.'
            echo 'batch_complete=false' >> "$GITHUB_OUTPUT"
          fi

      # Always preserve per-source logs, including when a download fails.
      - name: Upload EPG diagnostic logs
        if: always() && steps.batch.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: epg-download-diagnostics-${{ github.run_id }}
          path: |
            epg-storage/work/logs/
            epg-storage/work/failures.json
            epg-storage/work/failed-sources.csv
          if-no-files-found: warn
          retention-days: 14

      # 8. Combine all completed EPG files
      - name: Combine all EPG files
        if: |
          steps.batch.outputs.skip != 'true' &&
          steps.download.outputs.batch_complete == 'true'
        shell: python
        run: |
          import os
          import glob
          import xml.etree.ElementTree as ET

          os.makedirs('public', exist_ok=True)
          files = sorted(glob.glob('epg-storage/work/guides/*.xml'))
          root = ET.Element('tv')

          for filename in files:
              print(f'Combining: {filename}')
              try:
                  source = ET.parse(filename).getroot()
                  if source.tag != 'tv':
                      raise ValueError(f'Unexpected XML root: {filename}')
                  if not root.attrib:
                      root.attrib.update(source.attrib)
                  root.extend(list(source))
              except Exception as e:
                  raise SystemExit(f'Failed to process {filename}: {e}')

          output = 'public/guide.xml'
          ET.ElementTree(root).write(output, encoding='utf-8', xml_declaration=True)
          print(f'Total EPG files combined: {len(files)}')
          print(f'Guide size: {os.path.getsize(output)} bytes')
          if not files:
              print('WARNING: No successful EPG sources exist; generated an empty TV XML guide.')

      # 9. Configure GitHub Pages
      - name: Configure GitHub Pages
        if: |
          steps.batch.outputs.skip != 'true' &&
          steps.download.outputs.batch_complete == 'true'
        uses: actions/configure-pages@v5

      # 10. Upload Pages artifact
      - name: Upload Pages artifact
        if: |
          steps.batch.outputs.skip != 'true' &&
          steps.download.outputs.batch_complete == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 11. Deploy updated guide
      - name: Deploy to GitHub Pages
        id: deploy
        if: |
          steps.batch.outputs.skip != 'true' &&
          steps.download.outputs.batch_complete == 'true'
        uses: actions/deploy-pages@v4

      # 12. Update EPG progress after successful deployment
      - name: Update EPG progress
        id: progress
        if: steps.deploy.outcome == 'success'
        shell: python
        env:
          SIGNATURE: ${{ steps.batch.outputs.signature }}
          NEXT_INDEX: ${{ steps.batch.outputs.next }}
          COMPLETE: ${{ steps.batch.outputs.complete }}
        run: |
          import os
          import json
          state = {
              'signature': os.environ['SIGNATURE'],
              'index': int(os.environ['NEXT_INDEX']),
              'complete': os.environ['COMPLETE'] == 'true'
          }
          with open('epg-storage/work/progress.json', 'w', encoding='utf-8') as f:
              json.dump(state, f, indent=2)
          print('EPG progress successfully updated.')
          print(f"Next index: {state['index']}")
          print(f"All sources processed: {state['complete']}")

      # 13. Save progress and retry state to storage branch
      - name: Save EPG progress
        if: steps.progress.outcome == 'success'
        shell: bash
        run: |
          set -e
          cd epg-storage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/
          if git diff --cached --quiet; then
            echo 'No storage changes to save.'
          else
            git commit -m 'Update EPG download progress and retry state'
            git push origin HEAD:epg-data
          fi
