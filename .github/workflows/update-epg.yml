
name: Update IPTV EPG

on:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Asia/Manila'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Checkout EPG storage branch
      - name: Checkout EPG storage branch
        uses: actions/checkout@v4
        with:
          ref: epg-data
          path: epg-storage

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install

      # 5. Download latest SITES.md
      - name: Download latest SITES.md
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/iptv-org/epg/master/SITES.md \
            -o /tmp/SITES.md

      # 6. Select the next batch using the persistent index.
      # Failed sources are considered processed and are NOT retried this cycle.
      - name: Select next EPG batch
        id: batch
        shell: python
        run: |
          import os
          import re
          import json
          import hashlib

          with open("/tmp/SITES.md", encoding="utf-8") as f:
              content = f.read()

          sites = []
          for row in re.findall(r'<tr\b[^>]*>(.*?)</tr>', content, re.S | re.I):
              if "🟢" not in row:
                  continue
              match = re.search(r'href="sites/([^"]+)"', row)
              if match:
                  sites.append(match.group(1))

          sites = list(dict.fromkeys(sites))
          if not sites:
              raise SystemExit("No active EPG sources found.")

          os.makedirs("epg-storage/work/guides", exist_ok=True)
          state_file = "epg-storage/work/progress.json"
          signature = hashlib.sha256(",".join(sites).encode()).hexdigest()

          state = {"signature": signature, "index": 0, "complete": False}
          if os.path.exists(state_file):
              try:
                  with open(state_file, encoding="utf-8") as f:
                      old = json.load(f)
                  if old.get("signature") == signature:
                      state = old
                  else:
                      print("Active source list changed; starting a new cycle at source 1.")
              except (OSError, json.JSONDecodeError):
                  print("Progress file is unreadable; starting at source 1.")

          if state.get("complete") is True:
              print("This source cycle is complete. No downloads are needed.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=true\n")
              raise SystemExit(0)

          index = max(0, min(int(state.get("index", 0)), len(sites)))
          batch_size = 5
          batch = sites[index:index + batch_size]
          next_index = index + len(batch)
          complete = next_index >= len(sites)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=false\n")
              f.write(f"sites={','.join(batch)}\n")
              f.write(f"signature={signature}\n")
              f.write(f"start={index}\n")
              f.write(f"total={len(sites)}\n")
              f.write(f"complete={str(complete).lower()}\n")

          print(f"Total active sources: {len(sites)}")
          print(f"Starting at index: {index}")
          print(f"Selected batch: {batch if batch else 'No downloads; deployment can be retried.'}")

      # 7. Download sources one by one. Every attempted source advances progress,
      # whether it succeeds, fails, or times out. Failed sources are not retried.
      - name: Download EPG batch
        id: download
        if: steps.batch.outputs.skip != 'true'
        shell: bash
        env:
          SITES: ${{ steps.batch.outputs.sites }}
          START_INDEX: ${{ steps.batch.outputs.start }}
          SIGNATURE: ${{ steps.batch.outputs.signature }}
          TOTAL_SITES: ${{ steps.batch.outputs.total }}
        run: |
          set -uo pipefail

          git -C epg-storage config user.name "github-actions[bot]"
          git -C epg-storage config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          is_valid_xml() {
            python - "$1" <<'PYXML'
          import sys
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
              if root.tag != "tv" or len(root) == 0:
                  sys.exit(1)
          except Exception:
              sys.exit(1)
          sys.exit(0)
          PYXML
          }

          save_source() {
            local site="$1"
            git -C epg-storage add -- "work/guides/${site}.xml"
            if ! git -C epg-storage diff --cached --quiet; then
              git -C epg-storage commit -m "Save completed EPG source: ${site}" &&
                git -C epg-storage push origin HEAD:epg-data
            fi
          }

          record_failure() {
            local site="$1"
            local reason="$2"
            mkdir -p epg-storage/work
            if [ ! -f epg-storage/work/failed-sources.csv ]; then
              echo 'cycle_signature,site,reason,attempted_utc' > epg-storage/work/failed-sources.csv
            fi
            printf '"%s","%s","%s","%s"\n' \
              "$SIGNATURE" "$site" "$reason" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              >> epg-storage/work/failed-sources.csv
          }

          IFS=',' read -ra SITE_LIST <<< "${SITES:-}"
          PROCESSED=0
          DEADLINE=$((SECONDS + 48 * 60))
          SITE_TIMEOUT=$((8 * 60))

          for site in "${SITE_LIST[@]}"; do
            [ -z "$site" ] && continue
            FILE="epg-storage/work/guides/${site}.xml"
            echo "================================"
            echo "Source: $site"

            # A valid existing XML is already completed; move past it.
            if [ -s "$FILE" ] && is_valid_xml "$FILE"; then
              echo "Already completed: $site"
              PROCESSED=$((PROCESSED + 1))
              continue
            fi

            REMAINING=$((DEADLINE - SECONDS))
            if [ "$REMAINING" -lt 120 ]; then
              echo "Time limit approaching; leaving $site and later sources for the next run."
              break
            fi

            ATTEMPT_TIMEOUT=$SITE_TIMEOUT
            if [ "$REMAINING" -lt "$ATTEMPT_TIMEOUT" ]; then
              ATTEMPT_TIMEOUT=$((REMAINING - 30))
            fi
            if [ "$ATTEMPT_TIMEOUT" -lt 30 ]; then
              echo "Not enough time to start $site; leaving it for the next run."
              break
            fi

            rm -f "$FILE"
            echo "Downloading: $site"

            if timeout --signal=TERM --kill-after=20s "${ATTEMPT_TIMEOUT}s" \
              npm run grab -- \
                --sites="$site" \
                --output="epg-storage/work/guides/{site}.xml"; then

              if [ -s "$FILE" ] && is_valid_xml "$FILE"; then
                echo "SUCCESS: $site"
                if save_source "$site"; then
                  echo "SAVED: $site"
                else
                  echo "ERROR: could not save XML for $site"
                  record_failure "$site" "save_failed"
                  rm -f "$FILE"
                fi
              else
                echo "ERROR: incomplete or invalid XML: $site"
                record_failure "$site" "invalid_or_empty_xml"
                rm -f "$FILE"
              fi
            else
              RC=$?
              if [ "$RC" -eq 124 ]; then
                echo "TIMEOUT (exit code 124): $site"
                record_failure "$site" "timeout_124"
              else
                echo "ERROR: $site failed with exit code $RC"
                record_failure "$site" "exit_code_${RC}"
              fi
              rm -f "$FILE"
            fi

            # Crucial: failed/timed-out attempts count as processed too.
            PROCESSED=$((PROCESSED + 1))
            echo "Moving to the next source. Processed in this run: $PROCESSED"
          done

          NEW_INDEX=$((START_INDEX + PROCESSED))
          if [ "$NEW_INDEX" -gt "$TOTAL_SITES" ]; then
            NEW_INDEX="$TOTAL_SITES"
          fi

          # Persist progress regardless of whether a source succeeded or failed.
          python - "$SIGNATURE" "$NEW_INDEX" "$TOTAL_SITES" <<'PYSTATE'
          import json, sys
          signature, index, total = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          state = {
              "signature": signature,
              "index": index,
              "complete": index >= total
          }
          with open("epg-storage/work/progress.json", "w", encoding="utf-8") as f:
              json.dump(state, f, indent=2)
          print(f"Progress saved: index {index}/{total}; cycle complete={state['complete']}")
          PYSTATE

          # Save progress and failure log even if every download in this batch failed.
          git -C epg-storage add -- work/progress.json work/failed-sources.csv
          if ! git -C epg-storage diff --cached --quiet; then
            git -C epg-storage commit -m "Advance EPG source progress"
            git -C epg-storage push origin HEAD:epg-data
          fi

          echo "Processed $PROCESSED source(s) in this run. Next index: $NEW_INDEX"
          echo "batch_complete=true" >> "$GITHUB_OUTPUT"
          if [ "$NEW_INDEX" -ge "$TOTAL_SITES" ]; then
            echo "cycle_complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "cycle_complete=false" >> "$GITHUB_OUTPUT"
          fi

      # 8. Combine all completed EPG files
      - name: Combine all EPG files
        if: |
          steps.batch.outputs.skip != 'true'
        shell: python
        run: |
          import os
          import glob
          import xml.etree.ElementTree as ET

          os.makedirs("public", exist_ok=True)

          files = sorted(
              glob.glob("epg-storage/work/guides/*.xml")
          )

          if not files:
              raise SystemExit("No EPG files available.")

          root = ET.Element("tv")

          for filename in files:
              print(f"Combining: {filename}")

              try:
                  tree = ET.parse(filename)
                  source = tree.getroot()

                  if source.tag != "tv":
                      raise ValueError(
                          f"Unexpected XML root: {filename}"
                      )

                  if not root.attrib:
                      root.attrib.update(source.attrib)

                  root.extend(list(source))

              except Exception as e:
                  raise SystemExit(
                      f"Failed to process {filename}: {e}"
                  )

          output = "public/guide.xml"

          ET.ElementTree(root).write(
              output,
              encoding="utf-8",
              xml_declaration=True
          )

          if os.path.getsize(output) == 0:
              raise SystemExit("Combined guide.xml is empty.")

          print(f"Total files: {len(files)}")
          print(f"Guide size: {os.path.getsize(output)} bytes")

      # 9. Configure GitHub Pages
      - name: Configure GitHub Pages
        if: |
          steps.batch.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      # 10. Upload Pages artifact
      - name: Upload Pages artifact
        if: |
          steps.batch.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 11. Deploy updated guide
      - name: Deploy to GitHub Pages
        id: deploy
        if: |
          steps.batch.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      # 12. Mark the cycle fully complete only after the final Pages deployment succeeds.
      - name: Mark EPG cycle complete
        if: steps.deploy.outcome == 'success' && steps.download.outputs.cycle_complete == 'true'
        shell: python
        run: |
          import json
          path = "epg-storage/work/progress.json"
          with open(path, encoding="utf-8") as f:
              state = json.load(f)
          state["complete"] = True
          with open(path, "w", encoding="utf-8") as f:
              json.dump(state, f, indent=2)

      # 13. Save final completion state to the storage branch.
      - name: Save final EPG state
        if: steps.deploy.outcome == 'success' && steps.download.outputs.cycle_complete == 'true'
        shell: bash
        run: |
          set -e
          cd epg-storage
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/progress.json
          if git diff --cached --quiet; then
            echo "No final state changes to save."
          else
            git commit -m "Mark EPG source cycle complete"
            git push origin HEAD:epg-data
          fi
