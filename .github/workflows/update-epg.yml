
name: Update IPTV EPG

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate EPG from all active sites
        shell: bash
        run: |
          python3 - <<'PY'
          import re

          with open("SITES.md", encoding="utf-8") as f:
              content = f.read()

          sites = []

          for row in re.findall(r"<tr>(.*?)</tr>", content, re.S):
              if "🟢" not in row:
                  continue

              match = re.search(r'href="sites/([^"]+)"', row)
              if match:
                  sites.append(match.group(1))

          with open("/tmp/sites.txt", "w") as f:
              f.write(",".join(sites))

          print(f"Found {len(sites)} active EPG sources.")
          PY

          SITES=$(cat /tmp/sites.txt)

          if [ -z "$SITES" ]; then
            echo "No active EPG sources found."
            exit 1
          fi

          mkdir -p public

          npm run grab --- \
            --sites="$SITES" \
            --output=public/guide.xml

          test -s public/guide.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
