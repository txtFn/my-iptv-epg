name: Update IPTV EPG

on:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Asia/Manila'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CHUNK_SIZE: "200"       # channels per download unit (big sites are split)
  BATCH_SIZE: "300"       # max units considered per run (time budget is the real limit)
  BUDGET_MIN: "100"       # minutes the download loop may run
  FIRST_TIMEOUT_MIN: "20" # per-unit timeout, first attempt
  RETRY_TIMEOUT_MIN: "40" # per-unit timeout, retries
  MAX_ATTEMPTS: "3"       # real failures allowed per unit per cycle
  SITE_STRIKE_LIMIT: "2"  # auto-skip a site after this many failed attempts (if it is mostly failing)
  EXCLUDE_SITES: ""       # comma-separated sites to skip entirely, e.g. "dstv.com"
  REFRESH_HOURS: "12"     # after a cycle completes, wait this long, then start a fresh one
  EPG_DAYS: "3"
  MAX_CONN: "3"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout EPG storage branch
        uses: actions/checkout@v4
        with:
          ref: epg-data
          path: epg-storage

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Shared helper: splits a site's channel list into chunks.
      - name: Write helper library
        shell: bash
        run: |
          cat > /tmp/epglib.py <<'PYLIB'
          import glob, math
          import xml.etree.ElementTree as ET

          def channel_elements(site):
              els = []
              for fn in sorted(glob.glob(f"sites/{site}/*.channels.xml")):
                  try:
                      root = ET.parse(fn).getroot()
                  except ET.ParseError:
                      continue
                  els.extend(root.findall("channel"))
              return els

          def chunk_count(site, size):
              return max(1, math.ceil(len(channel_elements(site)) / size))

          def write_chunk(site, k, size, path):
              els = channel_elements(site)[k * size:(k + 1) * size]
              if not els:
                  return False
              root = ET.Element("channels")
              root.extend(els)
              ET.ElementTree(root).write(path, encoding="utf-8", xml_declaration=True)
              return True
          PYLIB

      # Stateless selection: pending = frozen cycle units - done - exhausted.
      # Units with fewer failures go first, so every unit gets a first
      # attempt before any retry.
      - name: Select pending units
        id: batch
        shell: python
        run: |
          import os, re, sys, json, urllib.request
          from datetime import datetime, timezone, timedelta
          sys.path.insert(0, "/tmp")
          import epglib

          REFRESH = timedelta(hours=float(os.environ["REFRESH_HOURS"]))
          MAX_ATTEMPTS = int(os.environ["MAX_ATTEMPTS"])
          BATCH_SIZE = int(os.environ["BATCH_SIZE"])
          CHUNK = int(os.environ["CHUNK_SIZE"])
          STATE = "epg-storage/work/progress.json"
          now = datetime.now(timezone.utc)

          def out(**kw):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  for k, v in kw.items():
                      f.write(f"{k}={v}\n")

          def fresh_sites():
              url = "https://raw.githubusercontent.com/iptv-org/epg/master/SITES.md"
              content = urllib.request.urlopen(url, timeout=60).read().decode("utf-8")
              sites = []
              for row in re.findall(r'<tr\b[^>]*>(.*?)</tr>', content, re.S | re.I):
                  if "🟢" not in row:
                      continue
                  m = re.search(r'href="sites/([^"]+)"', row)
                  if m:
                      sites.append(m.group(1).strip("/"))
              return list(dict.fromkeys(sites))

          os.makedirs("epg-storage/work/guides", exist_ok=True)

          state = None
          if os.path.exists(STATE):
              try:
                  with open(STATE, encoding="utf-8") as f:
                      state = json.load(f)
                  if not isinstance(state.get("units"), list):
                      state = None  # old format -> start a new cycle
              except (OSError, json.JSONDecodeError):
                  state = None

          if state and state.get("complete"):
              try:
                  age = now - datetime.fromisoformat(state["completed_at"])
              except Exception:
                  age = REFRESH
              if age < REFRESH:
                  print(f"Cycle complete {age} ago; next refresh after {REFRESH}.")
                  out(skip="true")
                  raise SystemExit(0)
              state = None

          if state is None:
              sites = fresh_sites()
              if not sites:
                  raise SystemExit("No active EPG sources found.")
              units = []
              for s in sites:
                  n = epglib.chunk_count(s, CHUNK)
                  units.extend(f"{s}@{k}" for k in range(n))
              state = {
                  "cycle_started": now.isoformat(),
                  "units": units,
                  "done": [],
                  "attempts": {},
                  "complete": False,
              }
              print(f"New cycle: {len(sites)} sources split into {len(units)} units.")
              with open(STATE, "w", encoding="utf-8") as f:
                  json.dump(state, f, indent=2)

          STRIKE_LIMIT = int(os.environ["SITE_STRIKE_LIMIT"])
          EXCLUDE = {x.strip() for x in os.environ.get("EXCLUDE_SITES", "").split(",") if x.strip()}

          def site_of(u):
              return u.rsplit("@", 1)[0]

          done = set(state["done"])
          attempts = state["attempts"]
          skipped = set(state.get("skipped", []))

          # Auto-skip: every failed attempt (timeout, error, bad XML) is a
          # "strike" against the site. A site is skipped for the rest of the
          # cycle once it has STRIKE_LIMIT strikes and strikes outnumber twice
          # its successes. Slow or broken sites (like dstv.com) get cut off
          # quickly, while healthy big sites with a few hiccups keep going.
          strikes, ok_by_site = {}, {}
          for u in state["units"]:
              s = site_of(u)
              strikes[s] = strikes.get(s, 0) + attempts.get(u, 0)
              if u in done:
                  ok_by_site[s] = ok_by_site.get(s, 0) + 1
          auto = {s for s, n in strikes.items()
                  if n >= STRIKE_LIMIT and n > 2 * ok_by_site.get(s, 0)}
          blocked = auto | EXCLUDE
          newly = {u for u in state["units"] if site_of(u) in blocked}
          if not newly <= skipped:
              skipped |= newly
              state["skipped"] = sorted(skipped)
              info = state.setdefault("skipped_sites", {})
              for s in sorted(auto):
                  info[s] = {"strikes": strikes[s], "done": ok_by_site.get(s, 0)}
              with open(STATE, "w", encoding="utf-8") as f:
                  json.dump(state, f, indent=2)
          if blocked:
              print(f"Skipping sites this cycle: {sorted(blocked)}")
              for s in sorted(auto):
                  print(f"  auto-skipped {s}: {strikes[s]} strikes, {ok_by_site.get(s, 0)} done")

          # Order: fewest failures first, then chunk number, so every site gets
          # its first chunk before any site gets its second (no site hogs the run).
          pending, rank, seen_idx = [], {}, {}
          for u in state["units"]:
              s = site_of(u)
              rank[u] = seen_idx.get(s, 0)
              seen_idx[s] = rank[u] + 1
              if u in done or u in skipped or attempts.get(u, 0) >= MAX_ATTEMPTS:
                  continue
              pending.append(u)
          pending.sort(key=lambda u: (attempts.get(u, 0), rank[u]))
          batch = pending[:BATCH_SIZE]

          print(f"Units: {len(state['units'])} | done: {len(done)} | pending: {len(pending)}")
          print(f"Next units: {batch[:10]}{' ...' if len(batch) > 10 else ''}")
          out(skip="false", units=",".join(batch))

      - name: Download EPG batch
        id: download
        if: steps.batch.outputs.skip != 'true'
        shell: bash
        env:
          UNITS: ${{ steps.batch.outputs.units }}
        run: |
          # GitHub starts bash with -e; turn it off so one failed grab
          # is recorded and the loop moves on instead of killing the step.
          set -u -o pipefail
          set +e

          STATE_FILE=epg-storage/work/progress.json
          FAILED_CSV=epg-storage/work/failed-sources.csv
          mkdir -p /tmp/grab epg-storage/work/guides
          [ -f "$FAILED_CSV" ] || echo 'unit,reason,attempted_utc' > "$FAILED_CSV"

          git -C epg-storage config user.name "github-actions[bot]"
          git -C epg-storage config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          is_valid_xml() {
            python - "$1" <<'PYXML'
          import sys
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
              if root.tag != "tv" or len(root) == 0:
                  sys.exit(1)
          except Exception:
              sys.exit(1)
          sys.exit(0)
          PYXML
          }

          update_state() {  # $1=unit  $2=done|fail
            python - "$STATE_FILE" "$1" "$2" <<'PYSTATE'
          import json, sys
          path, unit, result = sys.argv[1:4]
          with open(path, encoding="utf-8") as f:
              s = json.load(f)
          if result == "done":
              if unit not in s["done"]:
                  s["done"].append(unit)
          else:
              s["attempts"][unit] = s["attempts"].get(unit, 0) + 1
          with open(path, "w", encoding="utf-8") as f:
              json.dump(s, f, indent=2)
          PYSTATE
          }

          get_attempts() {
            python - "$STATE_FILE" "$1" <<'PYGET'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              print(json.load(f)["attempts"].get(sys.argv[2], 0))
          PYGET
          }

          make_chunk() {  # $1=site $2=k $3=outfile ; exit 0 if a chunk file was written
            python - "$1" "$2" "$CHUNK_SIZE" "$3" <<'PYCHUNK'
          import sys
          sys.path.insert(0, "/tmp")
          import epglib
          site, k, size, path = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]
          sys.exit(0 if epglib.write_chunk(site, k, size, path) else 1)
          PYCHUNK
          }

          commit_push() {
            git -C epg-storage add -A -- work
            if ! git -C epg-storage diff --cached --quiet; then
              git -C epg-storage commit -q -m "$1" &&
                git -C epg-storage push -q origin HEAD:epg-data
            fi
          }

          record_failure() {
            printf '"%s","%s","%s"\n' "$1" "$2" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$FAILED_CSV"
          }

          # Detect which flags this version of the grabber supports.
          GRAB_HELP=$(npm run grab -- --help 2>&1 || true)
          if echo "$GRAB_HELP" | grep -q -- '--sites'; then
            SITE_FLAG="--sites"
          else
            SITE_FLAG="--site"
          fi
          HAS_CHANNELS=0
          echo "$GRAB_HELP" | grep -q -- '--channels' && HAS_CHANNELS=1
          EXTRA=()
          echo "$GRAB_HELP" | grep -q -- '--days' && EXTRA+=("--days=$EPG_DAYS")
          echo "$GRAB_HELP" | grep -q -- '--maxConnections' && EXTRA+=("--maxConnections=$MAX_CONN")
          echo "Site flag: $SITE_FLAG | --channels supported: $HAS_CHANNELS | extra: ${EXTRA[*]:-none}"

          IFS=',' read -ra UNIT_LIST <<< "${UNITS:-}"
          DEADLINE=$((SECONDS + BUDGET_MIN * 60))
          OK=0; FAIL=0
          declare -A STRIKES OKS   # per-site results during this run

          for unit in "${UNIT_LIST[@]}"; do
            [ -z "$unit" ] && continue
            site="${unit%@*}"
            k="${unit##*@}"

            # Same auto-skip rule as the selection step, applied mid-run.
            S=${STRIKES[$site]:-0}; G=${OKS[$site]:-0}
            if [ "$S" -ge "$SITE_STRIKE_LIMIT" ] && [ "$S" -gt "$((2 * G))" ]; then
              echo "AUTO-SKIP: $unit ($site keeps failing: $S strikes, $G ok)"
              continue
            fi
            echo "================================"
            echo "Unit: $unit (site $site, chunk $k)"

            REMAINING=$((DEADLINE - SECONDS))
            if [ "$REMAINING" -lt 120 ]; then
              echo "Time budget used up; remaining units wait for the next run."
              break
            fi

            ATT=$(get_attempts "$unit")
            if [ "$ATT" -eq 0 ]; then
              T=$((FIRST_TIMEOUT_MIN * 60))
            else
              T=$((RETRY_TIMEOUT_MIN * 60))
            fi

            # If the run's time budget (not the unit) is what limits us,
            # a timeout must not count as a failed attempt.
            CAPPED=0
            if [ "$((REMAINING - 30))" -lt "$T" ]; then
              T=$((REMAINING - 30))
              CAPPED=1
              if [ "$T" -lt 300 ]; then
                echo "Not enough time left to give $unit a fair try; next run."
                break
              fi
            fi

            TMP="/tmp/grab/${site}__${k}.xml"
            CHUNK_FILE="/tmp/grab/${site}__${k}.channels.xml"
            FILE="epg-storage/work/guides/${site}__${k}.xml"
            rm -f "$TMP" "$CHUNK_FILE"

            if [ "$HAS_CHANNELS" -eq 1 ] && make_chunk "$site" "$k" "$CHUNK_FILE"; then
              SELECT_ARGS=("--channels=$CHUNK_FILE")
            else
              SELECT_ARGS=("$SITE_FLAG=$site")   # no channel list found: whole site
            fi
            echo "Downloading $unit (attempt $((ATT + 1)), limit ${T}s)"

            timeout --signal=TERM --kill-after=20s "${T}s" \
              npm run grab -- \
                "${SELECT_ARGS[@]}" \
                "${EXTRA[@]}" \
                --output="$TMP"
            RC=$?
            # timeout only stops npm; make sure the grabber itself is gone.
            pkill -f "commands/epg/grab" 2>/dev/null || true

            if [ "$RC" -eq 0 ] && [ -s "$TMP" ] && is_valid_xml "$TMP"; then
              # Replace old data only now, so a failed refresh keeps old guides.
              cp "$TMP" "$FILE"
              rm -f "epg-storage/work/guides/${site}.xml"   # legacy whole-site file
              update_state "$unit" done
              commit_push "Save EPG unit: ${unit}" || echo "WARN: push failed for $unit"
              echo "SUCCESS: $unit"
              OK=$((OK + 1))
              OKS[$site]=$(( ${OKS[$site]:-0} + 1 ))
            elif [ "$RC" -eq 124 ] && [ "$CAPPED" -eq 1 ]; then
              echo "Cut off by run budget (not counted as a failure): $unit"
              break
            else
              if [ "$RC" -eq 124 ]; then REASON="timeout"
              elif [ "$RC" -eq 0 ]; then REASON="invalid_or_empty_xml"
              else REASON="exit_code_${RC}"; fi
              echo "FAILED ($REASON): $unit"
              update_state "$unit" fail
              record_failure "$unit" "$REASON"
              commit_push "Record EPG failure: ${unit}" || echo "WARN: push failed"
              FAIL=$((FAIL + 1))
              STRIKES[$site]=$(( ${STRIKES[$site]:-0} + 1 ))
            fi
            rm -f "$TMP" "$CHUNK_FILE"
          done

          echo "Run finished. Succeeded: $OK, failed: $FAIL"

      # Streams files, so memory stays flat even for very large guides.
      # Channels are written first (deduplicated), then programmes.
      - name: Combine all EPG files
        if: steps.batch.outputs.skip != 'true'
        shell: python
        run: |
          import os, glob, gzip, shutil
          import xml.etree.ElementTree as ET

          os.makedirs("public", exist_ok=True)
          files = sorted(glob.glob("epg-storage/work/guides/*.xml"))
          if not files:
              raise SystemExit("No EPG files available.")

          seen = set()
          counts = {"channel": 0, "programme": 0}
          bad = []

          with open("public/guide.xml", "wb") as out:
              out.write(b'<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n')
              for tag in ("channel", "programme"):
                  for fn in files:
                      try:
                          for _, el in ET.iterparse(fn, events=("end",)):
                              if el.tag not in ("channel", "programme"):
                                  continue
                              if el.tag == tag:
                                  if tag == "channel":
                                      cid = el.get("id")
                                      if cid in seen:
                                          el.clear()
                                          continue
                                      seen.add(cid)
                                  out.write(ET.tostring(el, encoding="utf-8"))
                                  out.write(b"\n")
                                  counts[tag] += 1
                              el.clear()
                      except ET.ParseError as e:
                          if fn not in bad:
                              bad.append(fn)
                          print(f"WARN: {fn}: {e}")
              out.write(b"</tv>\n")

          with open("public/guide.xml", "rb") as src, gzip.open("public/guide.xml.gz", "wb") as dst:
              shutil.copyfileobj(src, dst)

          print(f"Files: {len(files)} (unreadable: {len(bad)})")
          print(f"Channels: {counts['channel']} | Programmes: {counts['programme']}")
          print(f"guide.xml: {os.path.getsize('public/guide.xml')} bytes")
          if counts["programme"] == 0:
              raise SystemExit("Combined guide has no programmes.")

      - name: Configure GitHub Pages
        if: steps.batch.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.batch.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.batch.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      # Complete only when nothing is pending AND the deploy succeeded.
      - name: Mark cycle complete
        if: steps.deploy.outcome == 'success'
        shell: python
        run: |
          import os, json
          from datetime import datetime, timezone
          path = "epg-storage/work/progress.json"
          with open(path, encoding="utf-8") as f:
              s = json.load(f)
          maxa = int(os.environ["MAX_ATTEMPTS"])
          done = set(s["done"])
          skipped = set(s.get("skipped", []))
          pending = [u for u in s["units"]
                     if u not in done and u not in skipped
                     and s["attempts"].get(u, 0) < maxa]
          if not pending:
              s["complete"] = True
              s["completed_at"] = datetime.now(timezone.utc).isoformat()
              gave_up = [u for u in s["units"] if u not in done]
              print(f"Cycle complete. Done: {len(done)}; gave up on: {gave_up}")
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(s, f, indent=2)
          else:
              print(f"{len(pending)} unit(s) still pending.")

      - name: Save state to storage branch
        if: always()
        shell: bash
        run: |
          [ -d epg-storage ] || exit 0
          cd epg-storage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- work
          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -q -m "Update EPG state"
            git push -q origin HEAD:epg-data
          fi
